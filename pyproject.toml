[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "landsat-grits"
version = "0.2.0b1"
description = "Landsat Collection 2 scene archives on S1-GRiTS MGRS grids"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "geopandas>=1.0,<2",
  "pyarrow>=14",
  "pyproj>=3.6",
  "shapely>=2,<3",
  "rasterio>=1.4,<2",
  "affine>=2.4",
  "zarr>=3.0,<4",
  "numcodecs>=0.15,<0.17",
  "requests>=2.31",
  "filelock>=3.16",
  "pyyaml>=6",
  "xarray>=2025.1",
  "dask[array]>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
aws = ["boto3>=1.35"]

[project.scripts]
landsat-grits = "landsat_grits.cli:main"

[project.urls]
Repository = "https://github.com/ottoKae/LandSat_GRiTS"
Issues = "https://github.com/ottoKae/LandSat_GRiTS/issues"
Releases = "https://github.com/ottoKae/LandSat_GRiTS/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/landsat_grits"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/config/example*.yaml", "/examples",
  "/README.md", "/README.zh-CN.md", "/LICENSE", "/NOTICE.md",
  "/CHANGELOG.md", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock",
  "/docs/*.md", "/.github/workflows/ci.yml",
  "/tooling/diagnostics/20261021_17mpu/prepare_pilot.py",
  "/tooling/diagnostics/20261021_17mpu/verify_full_tile.py",
  "/tooling/diagnostics/20261021_shenzhen/append_second_path.py",
  "/tooling/diagnostics/20261022-yearly-sensors/download.py",
  "/tooling/release/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
